# ──────────────────────────────────────────────────────────
#  Inventory POS — Full Stack Docker Compose
#
#  Usage:
#    docker compose up --build          # Start everything
#    docker compose down                # Stop everything
#    docker compose down -v             # Stop + delete data
#
#  Services:
#    frontend  → http://localhost:3000
#    backend   → http://localhost:5000
#    mongodb   → localhost:27017  (loopback only — not internet-accessible)
#    redis     → localhost:6379   (loopback only — not internet-accessible)
#
#  Required env vars (must be set before running):
#    JWT_ACCESS_SECRET    — at least 32 random characters
#    JWT_REFRESH_SECRET   — at least 32 random characters
#    CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET
# ──────────────────────────────────────────────────────────

services:
  # ─── MongoDB ───────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: pos-mongodb
    ports:
      # Bind to loopback only — prevents internet exposure on a VPS.
      # Remove this ports: entry entirely if you don't need local DB access.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pos-redis
    ports:
      # Bind to loopback only — prevents BullMQ job injection from the internet.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Backend API ───────────────────────────────────────
  backend:
    build: ./backend
    container_name: pos-backend
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/inventory-pos
      # :? syntax — Compose will refuse to start if these are unset or empty.
      # Generate with: openssl rand -hex 32
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required. Generate with: openssl rand -hex 32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required. Generate with: openssl rand -hex 32}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      LOGIN_RATE_LIMIT_WINDOW_MS: 900000
      LOGIN_RATE_LIMIT_MAX: 5
      CORS_ORIGIN: http://localhost:3000
      REDIS_URL: redis://redis:6379
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
      # Admin seed credentials — set these before first run, then remove or rotate
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORE_NAME: "Inventory POS"
      STORE_PHONE: ""
      STORE_ADDRESS: ""
    restart: unless-stopped

  # ─── Frontend (Nginx) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: pos-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:

