<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inventory & Point of Sale Management System — manage products, process sales, track customers." />
    <meta name="theme-color" content="#14211c" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>Inventory POS</title>
    <script>
      // Apply the saved theme before first paint (light by default)
      (function () {
        var t = "light";
        try { t = localStorage.getItem("theme") || "light"; } catch (e) {}
        var root = document.documentElement;
        root.classList.toggle("dark", t === "dark");
        root.style.colorScheme = t;
        var p = "peacock";
        try { p = localStorage.getItem("palette") || "peacock"; } catch (e) {}
        root.dataset.palette = p;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
